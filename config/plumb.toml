# Plumb configuration. Protocol constants, score parameters and every money cap live here, never in code (AGENTS.md rule 6).
# Decimals are strings, parsed exactly.

[xrpl]
network = "xrpl:0"
source_tag = 804681468
rlusd_currency = "524C555344000000000000000000000000000000"
rlusd_issuer = "rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De"
# Public full-history server on port 443 (U0). Quicknode replaces it in env/ledger.env for the ingest daemon.
rpc_url = "https://s2.ripple.com/"

[bazaar]
base = "https://api.cdp.coinbase.com/platform/v2/x402/discovery"
top_n = 20

[t54]
mainnet = "https://xrpl-facilitator-mainnet.t54.ai"
testnet = "https://xrpl-facilitator-testnet.t54.ai"

[vet402]
export_csv = "https://vet402.com/api/v1/observatory/export.csv"

[score]
prior_strength_m = 4
# E2: 64 of 202 XRPL purchases were usable.
global_good_rate = "0.32"
recency_tau_days = 7
cluster_window_minutes = 10
price_dishonest_factor = "0.5"
# §3.5: weight of the global mean when it becomes a principal's prior.
principal_strength_kappa = 8
# A rail is excluded when its posterior P(settle) falls below this (RECOMMENDER §4).
settle_min = "0.2"
# A repeat purchase of the same endpoint by a real payer counts as this much implicit "good" (RECOMMENDER §4).
implicit_repeat_weight = "0.5"
# Collaborative nudge: at most this many pseudo "good" observations from similar agents (RECOMMENDER §4b).
cf_max_shift = "1.0"

[rank]
k_default = 3
k_max = 5
candidates_max = 40
# Candidates under this relevance are never shown (an off-catalogue need returns []).
fit_min = "0.3"
# Embedding candidates kept before the BM25 rerank.
embed_top = 40
# Agent time value used when the principal declares none (RLUSD per second waited). An assumption, not evidence.
default_time_value_rlusd_per_s = "0.0001"

[judge]
provider = "bedrock"          # bedrock | lexical. Jev (TypeSafe) is a candidate fast provider if it reaches Bedrock.
# Haiku 5.5 is denied on the workshop role and Haiku 4.5 rejects structured output there (LIMITS L24).
bedrock_model = "us.anthropic.claude-sonnet-5-5"
region = "us-west-2"
effort = "low"
max_listing_chars = 1200
max_tokens = 8000
candidates_per_need = 40

[judge.p_fit]
exact = "0.9"
partial = "0.5"
wrong = "0.05"

[embed]
model = "amazon.titan-embed-text-v2:0"
dims = 256
region = "us-west-2"

[demo]
seed = 7
simulated_purchases_per_persona = 120

[eval]
# Free U7: an XRP challenge within this relative drift of the listed drops counts as the listed price
# (sellers peg to USD and re-convert live; seen 2,369 vs 2,370 drops).
xrp_price_drift = "0.02"

[paths]
db = "out/plumb.db"
snapshot = "data/bazaar_snapshot.json"
vet402_snapshot = "data/vet402_xrpl.csv"
personas = "config/personas.toml"
queries = "eval/queries.yaml"

[caps]
# Real-money caps (RLUSD). Spending needs --live plus these, and the user's go-ahead (AGENTS.md rule 1).
audit_max_per_purchase = "0.01"
audit_max_per_day = "1"
audit_max_total = "5"
eval_max_total = "3"
