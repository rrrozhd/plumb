[project]
name = "plumb"
version = "0.1.0"
description = "Trust and recommendation layer between AI agents and XRPL x402 merchants"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=0.70",
    "boto3>=1.43.118",
    "httpx>=0.27",
    "mcp>=1.10",
    "mpmath>=1.4.1",
    "numpy>=2.5.4",
    "pyyaml>=6",
    "xrpl-py>=5.2.0",
]

[project.scripts]
plumb = "plumb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plumb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "p0: offline, deterministic build gate",
    "live: needs network, credentials or real money; run only at a unit's gate",
]
addopts = "-ra"
